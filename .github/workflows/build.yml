name: Build and Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "swift-format version (e.g. 602.0.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: write

env:
  SWIFT_SDK_URL: "https://download.swift.org/swift-6.2.3-release/static-sdk/swift-6.2.3-RELEASE/swift-6.2.3-RELEASE_static-linux-0.0.1.artifactbundle.tar.gz"
  SWIFT_SDK_CHECKSUM: "f30ec724d824ef43b5546e02ca06a8682dafab4b26a99fbb0e858c347e507a2c"

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Checkout swift-format source
        uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-format
          ref: ${{ inputs.version }}
          path: swift-format-src

      - name: Build macOS universal binary
        working-directory: swift-format-src
        run: bash $GITHUB_WORKSPACE/scripts/build-macos.sh

      - name: Package artifact
        working-directory: swift-format-src
        env:
          SWIFT_FORMAT_VERSION: ${{ inputs.version }}
        run: |
          bash $GITHUB_WORKSPACE/scripts/package-artifacts.sh macos universal
          mv swift-format-${{ inputs.version }}-macos-universal.tar.gz $GITHUB_WORKSPACE/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-macos-universal
          path: swift-format-${{ inputs.version }}-macos-universal.tar.gz

  build-linux-x86_64:
    runs-on: macos-14
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Checkout swift-format source
        uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-format
          ref: ${{ inputs.version }}
          path: swift-format-src

      - name: Install Swift Static Linux SDK
        run: bash scripts/install-swift-sdk.sh

      - name: Build Linux x86_64 binary
        working-directory: swift-format-src
        run: bash $GITHUB_WORKSPACE/scripts/build-linux.sh x86_64

      - name: Package artifact
        working-directory: swift-format-src
        env:
          SWIFT_FORMAT_VERSION: ${{ inputs.version }}
        run: |
          bash $GITHUB_WORKSPACE/scripts/package-artifacts.sh linux x86_64
          mv swift-format-${{ inputs.version }}-linux-x86_64.tar.gz $GITHUB_WORKSPACE/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-linux-x86_64
          path: swift-format-${{ inputs.version }}-linux-x86_64.tar.gz

  build-linux-aarch64:
    runs-on: macos-14
    steps:
      - name: Checkout build scripts
        uses: actions/checkout@v4

      - name: Checkout swift-format source
        uses: actions/checkout@v4
        with:
          repository: swiftlang/swift-format
          ref: ${{ inputs.version }}
          path: swift-format-src

      - name: Install Swift Static Linux SDK
        run: bash scripts/install-swift-sdk.sh

      - name: Build Linux aarch64 binary
        working-directory: swift-format-src
        run: bash $GITHUB_WORKSPACE/scripts/build-linux.sh aarch64

      - name: Package artifact
        working-directory: swift-format-src
        env:
          SWIFT_FORMAT_VERSION: ${{ inputs.version }}
        run: |
          bash $GITHUB_WORKSPACE/scripts/package-artifacts.sh linux aarch64
          mv swift-format-${{ inputs.version }}-linux-aarch64.tar.gz $GITHUB_WORKSPACE/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifact-linux-aarch64
          path: swift-format-${{ inputs.version }}-linux-aarch64.tar.gz

  publish:
    runs-on: ubuntu-latest
    needs: [build-macos, build-linux-x86_64, build-linux-aarch64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Generate checksums
        run: |
          VERSION="${{ inputs.version }}"
          sha256sum \
            "swift-format-${VERSION}-macos-universal.tar.gz" \
            "swift-format-${VERSION}-linux-x86_64.tar.gz" \
            "swift-format-${VERSION}-linux-aarch64.tar.gz" \
            > "swift-format-${VERSION}-checksums.txt"
          cat "swift-format-${VERSION}-checksums.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          make_latest: true
          files: |
            swift-format-${{ inputs.version }}-macos-universal.tar.gz
            swift-format-${{ inputs.version }}-linux-x86_64.tar.gz
            swift-format-${{ inputs.version }}-linux-aarch64.tar.gz
            swift-format-${{ inputs.version }}-checksums.txt
          fail_on_unmatched_files: true
          overwrite_files: true
